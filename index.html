<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>대본 연습실</title>
<meta name="description" content="연극 대본을 올리면 막·장을 나누고 작품과 인물을 분석해, 내 대사를 가려 외우게 돕는 연습 앱">
<meta name="theme-color" content="#1E5A86">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="대본 연습실">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow column like a rehearsal binder; my lines carry a highlighter stripe, key words a darker marker; stage beats 기·승·전·결 get their own four hues. */
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --fg:#1B2027; --muted:#5B6470; --line:#DADFE5;
  --accent:#1E5A86; --accent-fg:#FFFFFF; --accent-soft:rgba(30,90,134,.10);
  --hl:rgba(255,212,0,.26); --key:rgba(255,184,0,.55); --ok:#1F7A4D; --ng:#B3402F; --blank:#AEB6C0;
  --gi:#3D7A5A; --seung:#2F6699; --jeon:#B0542E; --gyeol:#6A4C93;
  --font-ui:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-script:"Gowun Batang","Noto Serif KR","Batang",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121519; --surface:#1B1F25; --fg:#E6E9EE; --muted:#9AA3AF; --line:#2D333B;
  --accent:#7DB8E8; --accent-fg:#0E1A24; --accent-soft:rgba(125,184,232,.14);
  --hl:rgba(232,197,71,.13); --key:rgba(232,197,71,.42); --ok:#5CC28C; --ng:#E77B68; --blank:#4E5661;
  --gi:#6CC195; --seung:#7AAEE0; --jeon:#E8956E; --gyeol:#B59BE0; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#121519; --surface:#1B1F25; --fg:#E6E9EE; --muted:#9AA3AF; --line:#2D333B;
  --accent:#7DB8E8; --accent-fg:#0E1A24; --accent-soft:rgba(125,184,232,.14);
  --hl:rgba(232,197,71,.13); --key:rgba(232,197,71,.42); --ok:#5CC28C; --ng:#E77B68; --blank:#4E5661;
  --gi:#6CC195; --seung:#7AAEE0; --jeon:#E8956E; --gyeol:#B59BE0; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 56px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3}
h1{font-size:22px} h2{font-size:18px} h3{font-size:15px}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
.label{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:500}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;min-height:42px;font-weight:500}
button:hover{border-color:var(--accent)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button.ghost{background:transparent;border-color:transparent;color:var(--muted)}
button.ghost:hover{color:var(--fg)}
button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
button.ng{background:transparent;border-color:var(--ng);color:var(--ng)}
button:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
input[type=text],input[type=number],textarea,select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input[type=number]{width:84px}
textarea{min-height:220px;resize:vertical;font-family:var(--font-script);font-size:15px;line-height:1.7}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.top{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.brand{font-family:var(--font-script);font-weight:700;font-size:22px}
.tabs{display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;overflow-x:auto}
.tabs button{flex:1;border:0;min-height:38px;border-radius:9px;background:transparent;color:var(--muted);padding:6px 8px;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--fg);font-weight:700}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;background:var(--surface);cursor:pointer;min-height:34px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.tag{display:inline-block;font-size:11px;letter-spacing:.04em;border-radius:6px;padding:2px 7px;background:var(--accent-soft);color:var(--accent);font-weight:700;white-space:nowrap}
.tag.ok{background:transparent;border:1px solid var(--ok);color:var(--ok)}
.tag.ng{background:transparent;border:1px solid var(--ng);color:var(--ng)}
.tag.plain{background:transparent;border:1px solid var(--line);color:var(--muted)}
.st{display:inline-grid;place-items:center;width:1.7em;height:1.7em;border-radius:50%;font-family:var(--font-script);font-weight:700;font-size:13px;color:#fff;flex:none}
.st-기{background:var(--gi)} .st-승{background:var(--seung)} .st-전{background:var(--jeon)} .st-결{background:var(--gyeol)}
.notice{border:1px dashed var(--line);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--muted)}
.notice.warn{border-color:var(--ng);color:var(--ng)}
.job{display:flex;align-items:center;gap:10px;border:1px solid var(--accent);background:var(--accent-soft);border-radius:12px;padding:10px 14px;font-size:13.5px}
/* library */
.cards{display:flex;flex-direction:column;gap:10px}
.card{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;text-align:left;width:100%}
.card:hover{border-color:var(--accent)}
.card .meta{font-size:13px;color:var(--muted)}
.hero{background:var(--surface);border:1px solid var(--accent);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.hero .big{font-family:var(--font-script);font-size:22px;font-weight:700}
.meter{height:6px;border-radius:99px;background:var(--line);overflow:hidden;width:100%}
.meter > i{display:block;height:100%;background:var(--ok);border-radius:99px}
.pct{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;min-width:52px;text-align:right}
.drop{border:2px dashed var(--line);border-radius:16px;padding:28px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;cursor:pointer;background:var(--surface)}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop .big{font-size:17px;font-weight:700}
details summary{cursor:pointer;color:var(--muted);font-size:14px;padding:4px 0}
/* script */
.script{display:flex;flex-direction:column;gap:2px;font-family:var(--font-script);font-size:16.5px;line-height:1.75}
.ln{display:grid;grid-template-columns:5.2em 1fr;gap:10px;padding:6px 8px;border-radius:8px;scroll-margin-top:80px}
.ln .who{font-family:var(--font-ui);font-size:13px;font-weight:700;color:var(--muted);padding-top:3px;overflow-wrap:anywhere}
.ln .say{min-width:0;overflow-wrap:anywhere}
.ln.mine{background:var(--hl)}
.ln.mine .who{color:var(--fg)}
.ln.flash{outline:2px solid var(--accent)}
.ln.dir{grid-template-columns:1fr;color:var(--muted);font-size:15px;padding-left:calc(5.2em + 18px)}
.sechead{display:flex;flex-direction:column;gap:4px;padding:18px 8px 8px;border-top:1px solid var(--line);margin-top:8px;font-family:var(--font-ui);scroll-margin-top:80px}
.sechead:first-child{border-top:0;margin-top:0;padding-top:4px}
.sechead .t{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
.sechead .ev{font-size:13px;color:var(--muted)}
.acthead{font-family:var(--font-script);font-weight:700;font-size:20px;padding:20px 8px 0}
.inline-dir{color:var(--muted);font-size:.9em}
mark.key{background:linear-gradient(transparent 52%,var(--key) 52%);color:inherit;font-weight:700;padding:0 1px}
.h{display:inline-block;width:.82em;height:1.05em;vertical-align:-.15em;border-bottom:2px solid var(--blank);margin:0 .5px}
.tools{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px;font-family:var(--font-ui)}
.tools button{min-height:32px;padding:4px 10px;font-size:12.5px;border-radius:8px}
.story{font-family:var(--font-ui);font-size:13.5px;line-height:1.6;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:8px 10px;margin-top:6px}
.story b{color:var(--accent)}
.toggles{display:flex;gap:6px;flex-wrap:wrap}
/* analysis */
.arc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.arc > div{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0;font-size:13.5px}
.arc .scenes{display:flex;flex-wrap:wrap;gap:4px}
.arc .scenes button{min-height:28px;padding:2px 8px;font-size:12px;border-radius:7px}
@media (max-width:600px){.arc{grid-template-columns:repeat(2,minmax(0,1fr))}.ln{grid-template-columns:4.2em 1fr}.ln.dir{padding-left:calc(4.2em + 18px)}}
.dl{display:grid;grid-template-columns:5.5em 1fr;gap:6px 12px;font-size:14px}
.dl dt{color:var(--muted);font-weight:500;font-size:13px} .dl dd{margin:0;min-width:0}
.sclist{display:flex;flex-direction:column}
.sc{display:grid;grid-template-columns:auto 3.2em 1fr;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-top:0;border-radius:0;min-height:0}
.sc:hover{background:var(--accent-soft)}
.sc .no{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);padding-top:2px}
.sc .tt{font-weight:700;font-size:14px} .sc .ev{font-size:13px;color:var(--muted)}
.map{width:100%;max-width:560px;margin:0 auto;display:block}
.map text{fill:var(--fg);font-family:var(--font-ui)}
.map .edge{stroke:var(--line);stroke-width:2;cursor:pointer}
.map .edge.sel{stroke:var(--accent);stroke-width:3}
.map .elab{font-size:11px;fill:var(--muted)}
.map .elabbg{fill:var(--bg)}
.map .node circle{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.map .node.me circle{fill:var(--accent)} .map .node.me text{fill:var(--accent-fg)}
.map .node{cursor:pointer}
.rel{display:flex;flex-direction:column;gap:4px;padding:10px 0;border-bottom:1px solid var(--line)}
.rel .pair{font-weight:700;font-size:14px}
.quote{font-family:var(--font-script);font-size:14px;border-left:3px solid var(--line);padding:2px 10px;color:var(--fg);cursor:pointer;background:none;border-top:0;border-right:0;border-bottom:0;border-radius:0;text-align:left;min-height:0}
.quote:hover{border-left-color:var(--accent)}
.quote .src{display:block;font-family:var(--font-ui);font-size:11.5px;color:var(--muted)}
.curve{width:100%;display:block}
.curve text{fill:var(--muted);font-family:var(--font-ui);font-size:12px}
.curve .zero{stroke:var(--line);stroke-dasharray:4 4}
.curve .grid{stroke:var(--line);stroke-width:.5}
.curve .ln2{fill:none;stroke:var(--accent);stroke-width:2.5}
.curve .area{fill:var(--accent-soft)}
.curve circle{fill:var(--surface);stroke:var(--accent);stroke-width:2;cursor:pointer}
.beats{display:flex;flex-direction:column;gap:6px}
.beat{display:grid;grid-template-columns:auto 3.2em 1fr;gap:10px;align-items:start;font-size:13.5px}
.beat .no{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px;padding-top:2px}
ul.pts{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px;font-size:14px}
/* run */
.stage{display:flex;flex-direction:column;gap:12px}
.ctx{font-family:var(--font-script);font-size:15px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.ctx .who{font-family:var(--font-ui);font-weight:700;font-size:12px;margin-right:6px}
.cue{font-family:var(--font-script);font-size:20px;line-height:1.7;min-height:3em}
.cue .who{display:block;font-family:var(--font-ui);font-size:13px;font-weight:700;color:var(--muted);margin-bottom:4px}
.cue.mine{background:var(--hl);border-radius:12px;padding:12px 14px}
.where{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.counter{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.bigbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bigbtns button{min-height:52px;font-size:16px}
.heard{font-family:var(--font-script);font-size:15px;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.heard .miss{color:var(--ng);font-weight:700}
.score{font-variant-numeric:tabular-nums;font-weight:700}
.range{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.range input{width:120px}
/* progress */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface)}
.stat b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.plist{display:flex;flex-direction:column}
.pitem{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;border-bottom:1px solid var(--line);padding:8px 0}
.pitem .txt{font-family:var(--font-script);min-width:0;overflow-wrap:anywhere}
.pitem .cnt{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.dot{width:10px;height:10px;border-radius:50%;margin-top:8px;background:var(--line)}
.dot.ok{background:var(--ok)} .dot.ng{background:var(--ng)} .dot.mid{background:var(--key)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px);z-index:20}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;vertical-align:-2px;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}}
.confirm{border:1px solid var(--ng);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
/* manual AI (copy question → paste answer) sheet */
.sheet{position:fixed;inset:0;z-index:30;background:rgba(10,14,20,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet > .box{background:var(--bg);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;
  padding:16px max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
.sheet textarea{min-height:140px;font-family:var(--font-ui);font-size:13px}
.steps{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px;font-size:14px}
a.btnlink{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;min-height:42px;font-weight:500;color:var(--fg);text-decoration:none}
a.btnlink:hover{border-color:var(--accent)}
.recording{border-color:var(--ng)!important;color:var(--ng)!important}
.notice button.ghost{min-height:0;padding:0 2px;color:var(--accent);text-decoration:underline;font:inherit}
</style>
</head>
<body>

<div class="wrap" id="app"></div>
<div class="sheet" id="manualSheet" hidden></div>
<input type="file" id="recInput" accept="audio/*" capture="user" hidden>
<input type="file" id="backupInput" accept="application/json,.json" hidden>
<input type="file" id="pdfInput" accept="application/pdf,.pdf,.hwp,.hwpx,application/x-hwp,application/haansofthwp,application/vnd.hancom.hwp,application/vnd.hancom.hwpx" hidden>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cfb@1.2.2/dist/cfb.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
/* =========================================================
   Example play (written for this app, clearly marked 예시)
   ========================================================= */
const EX_LINES=[

  {k:"line",r:"민호",t:"(가방을 받으며) 핑계라니. 무슨 핑계."},
  {k:"line",r:"수진",t:"너한테 연락할 핑계. 그만하자고 한 건 나니까, 내가 먼저 끊어야지."},

  {k:"scene",r:"",t:"2장 · 사진동아리 방, 다음 날 아침"},

const exI=snip=>EX_LINES.findIndex(l=>l.t.includes(snip));

/* =========================================================
   Parsing: lines, acts and scenes
   ========================================================= */
const DN="[0-9０-９]+|[一二三四五六七八九十]+", HN="[일이삼사오육칠팔구십]+";
const AFTER="(?=$|[\\s.,·:\\-–—(（\\[])";
const ACT_RE=new RegExp(`^(?:제\\s*(?:${DN}|${HN})|(?:${DN}))\\s*막${AFTER}`);
const SCENE_RE=new RegExp(`^(?:제\\s*(?:${DN}|${HN})|(?:${DN}))\\s*장${AFTER}`);
const ACTSCENE_RE=new RegExp(`^((?:제\\s*)?(?:${DN}|${HN})\\s*막)[\\s,·.]*((?:제\\s*)?(?:${DN}|${HN})\\s*장)${AFTER}`);
const SPECIAL_RE=/^(프롤로그|에필로그|서막|종막|막간|prologue|epilogue)(?=$|[\s.,·:\-–—(])/i;
const SCENEMARK_RE=/^(S\s*#\s*\d+|#\s*\d+|씬\s*\d+|장면\s*\d+|scene\s+\d+)/i;
function numOf(t){
  const m=String(t).match(/[0-9０-９]+|[一二三四五六七八九十]+|[일이삼사오육칠팔구십]+/); if(!m) return null;
  const s=m[0].replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248));
  if(/^\d+$/.test(s)) return Number(s);
  const map={"一":1,"二":2,"三":3,"四":4,"五":5,"六":6,"七":7,"八":8,"九":9,"十":10,"일":1,"이":2,"삼":3,"사":4,"오":5,"육":6,"칠":7,"팔":8,"구":9,"십":10};
  if(s.length===1) return map[s]||null;
  if(s.length===2&&(s[0]==="十"||s[0]==="십")) return 10+(map[s[1]]||0);
  if(s.length===2&&(s[1]==="十"||s[1]==="십")) return (map[s[0]]||0)*10;
  if(s.length===3) return (map[s[0]]||0)*10+(map[s[2]]||0);
  return null;
}
function parseScript(text){
  const out=[]; let speaker=null, fresh=false, lastAct=null;
  for(const raw of text.split(/\r?\n/)){
    const line=raw.replace(/\s+/g," ").trim();
    if(!line){ speaker=null; continue; }
    if(/^[-–—\s]*\d{1,3}[-–—\s]*$/.test(line)) continue; // page numbers
    // HWP/word-processor layout: "이름<TAB>대사", and a line that starts with a tab is a stage direction
    if(raw.includes("\t") && !ACT_RE.test(line) && !SCENE_RE.test(line) && !SPECIAL_RE.test(line)){
      if(/^\s*\t/.test(raw)){ out.push({k:"dir",r:"",t:line}); speaker=null; continue; }
      const tm=raw.match(/^([^\t:：]{1,24}?)\s*\t+\s*(\S.*)$/);
      if(tm){
        let name=tm[1].replace(/\s+/g," ").trim(), body=tm[2].replace(/\s+/g," ").trim(), lead="";
        const pm=name.match(/^(.*?)\s*([(（].*[)）])$/);
        if(pm){ name=pm[1].trim(); lead=pm[2]+" "; }
        if(name && name.length<=12 && !/[.,!?。"“”]/.test(name)){ out.push({k:"line",r:name,t:(lead+body).trim(),blk:1}); speaker=null; continue; }
      }
    }
    if(line.length<=48){
      const as=line.match(ACTSCENE_RE);
      if(as){ const an=numOf(as[1]); if(an!==lastAct){ out.push({k:"act",r:"",t:`${an??as[1]}막`}); lastAct=an; } out.push({k:"scene",r:"",t:line.slice(as[1].length).replace(/^[\s,·.]+/,"")}); speaker=null; continue; }
      if(ACT_RE.test(line)){ out.push({k:"act",r:"",t:line}); lastAct=numOf(line); speaker=null; continue; }
      if(SCENE_RE.test(line)||SPECIAL_RE.test(line)||SCENEMARK_RE.test(line)){ out.push({k:"scene",r:"",t:line}); speaker=null; continue; }
    }
    const m=line.match(/^([^:：]{1,24}?)\s*[:：]\s*(.*)$/);
    if(m){
      let name=m[1].trim(), body=m[2].trim(), lead="";
      const pm=name.match(/^(.*?)\s*([(（].*[)）])$/);
      if(pm){ name=pm[1].trim(); lead=pm[2]+" "; }
      if(name && name.length<=12 && !/[.,!?。"“”]/.test(name)){
        if(!body){ speaker=name; fresh=true; continue; }
        out.push({k:"line",r:name,t:(lead+body).trim()}); speaker=null; continue;
      }
    }
    if(/^[(（\[].*[)）\]]$/.test(line)){ out.push({k:"dir",r:"",t:line}); continue; }
    if(speaker){
      const prev=out[out.length-1];
      if(!fresh && prev && prev.k==="line" && prev.r===speaker) prev.t+=" "+line;
      else out.push({k:"line",r:speaker,t:line,blk:1});
      fresh=false; continue;
    }
    if(line.length<=10 && !/[.,!?。…~"'“”\-]/.test(line) && line.split(" ").length<=2){ speaker=line; fresh=true; continue; }
    const prev=out[out.length-1];
    if(prev && prev.k==="line") prev.t+=" "+line; else out.push({k:"dir",r:"",t:line});
  }
  // cover page / cast list before the first act or scene: name-only guesses there are not dialogue
  const first=out.findIndex(l=>l.k==="act"||l.k==="scene");
  for(let i=0;i<out.length;i++){ const l=out[i]; if(l.blk&&first>0&&i<first){ out[i]={k:"dir",r:"",t:`${l.r} ${l.t}`}; } else delete l.blk; }
  // "엄 마" / "화 자": names letter-spaced for alignment are the same person as "엄마" / "화자"
  const names=new Set(out.filter(l=>l.k==="line").map(l=>l.r));
  out.forEach(l=>{ if(l.k==="line"&&/\s/.test(l.r)){ const ns=l.r.replace(/\s+/g,""); if(names.has(ns)||/^(\S\s)+\S$/.test(l.r)) l.r=ns; } });
  return out;
}
function rolesOf(lines){
  const c={}; lines.forEach(l=>{ if(l.k==="line") c[l.r]=(c[l.r]||0)+1; });
  return Object.entries(c).sort((a,b)=>b[1]-a[1]).map(([r,n])=>({r,n}));
}
const secCache=new WeakMap();
function sectionsOf(s){
  const key=s.lines; const hit=secCache.get(key);
  if(hit && hit.ai===s.aiSections) return hit.v;
  const L=s.lines, out=[]; let act=null, actNo=null;
  const marked=L.some(l=>l.k==="act"||l.k==="scene");
  if(marked){
    L.forEach((l,i)=>{
      if(l.k==="act"){ act=l.t; actNo=numOf(l.t); out.push({start:i,act,actNo,sceneNo:null,title:l.t,isAct:true}); }
      else if(l.k==="scene"){
        const last=out[out.length-1];
        if(last&&last.isAct&&!L.slice(last.start,i).some(x=>x.k==="line")) out.pop();
        out.push({start:i,act,actNo,sceneNo:numOf(l.t),title:l.t});
      }
    });
    if(out.length&&out[0].start>0&&L.slice(0,out[0].start).some(l=>l.k==="line")) out.unshift({start:0,title:"첫머리"});
  } else if(s.aiSections&&s.aiSections.length){
    s.aiSections.forEach((x,k)=>out.push({start:x.start,title:x.title||`장면 ${k+1}`,sceneNo:k+1,ai:true}));
    if(out[0].start>0) out[0].start=0;
  } else out.push({start:0,title:"전체",whole:true});
  out.forEach((x,k)=>{
    x.end=out[k+1]?out[k+1].start:L.length; x.idx=k;
    x.short= x.actNo&&x.sceneNo? `${x.actNo}-${x.sceneNo}` : x.sceneNo? `${x.sceneNo}장` : x.actNo&&x.isAct? `${x.actNo}막` : (x.title&&!x.whole&&!x.ai? [...x.title.replace(/^d+막s*/,"").trim()].slice(0,4).join("") : "") || `#${k+1}`;
    x.label= x.act&&!x.isAct&&!/막/.test(x.title)? `${x.act} ${x.title}` : x.title;
  });
  secCache.set(key,{ai:s.aiSections,v:out});
  return out;
}
const secOfLine=(s,i)=>sectionsOf(s).find(x=>i>=x.start&&i<x.end);
const speechOnly=t=>t.replace(/[(（][^)）]*[)）]/g," ").replace(/\s+/g," ").trim();
const norm=t=>speechOnly(t).replace(/[^0-9A-Za-zㄱ-ㆎ가-힣]/g,"");

function rowsToText(items){
  const rows=[];
  for(const it of items){
    if(!it.str) continue;
    const x=it.transform[4], y=it.transform[5], h=Math.abs(it.transform[3])||Math.abs(it.height)||10;
    let row=rows.find(r=>Math.abs(r.y-y)<h*0.5);
    if(!row){ row={y,h,items:[]}; rows.push(row); }
    row.items.push({x,w:it.width||0,str:it.str,h});
  }
  rows.sort((a,b)=>b.y-a.y);
  return rows.map(r=>{
    r.items.sort((a,b)=>a.x-b.x);
    let s="", end=null, gaps=0;
    for(const it of r.items){
      if(end!==null){
        const gap=it.x-end;
        if(gap>r.h*2.2 && gaps===0 && s.trim().length<=10 && !/[:：]/.test(s) && it.str.trim()) { s=s.trim()+": "; gaps++; }
        else if(gap>r.h*0.2 && !s.endsWith(" ") && !it.str.startsWith(" ")) s+=" ";
      }
      s+=it.str; end=it.x+it.w;
    }
    return s.trim();
  }).filter(Boolean).join("\n");
}

function hwpToText(bytes){
  const cfb=CFB.read(bytes,{type:"array"});
  const fhE=CFB.find(cfb,"FileHeader");
  if(!fhE) throw {code:"not_hwp"};
  const fh=fhE.content, sig=String.fromCharCode(...Array.from(fh.slice(0,17)));
  if(sig!=="HWP Document File") throw {code:"not_hwp"};
  const props=fh[36]|(fh[37]<<8)|(fh[38]<<16)|(fh[39]<<24);
  if(props&2) throw {code:"encrypted"};
  if(props&4) throw {code:"distribution"};
  const secs=cfb.FullPaths.map((p,i)=>({p,i})).filter(x=>/BodyText\/Section(\d+)$/.test(x.p))
    .sort((a,b)=>Number(a.p.match(/(\d+)$/)[1])-Number(b.p.match(/(\d+)$/)[1]));

  const out=[];

}
function hwpParaText(d,o,sz){
  let s="";
  for(let i=0;i<sz/2;){
    const c=d[o+i*2]|(d[o+i*2+1]<<8);
    if(c<32){
      if(c===10){ s+="\n"; i++; continue; }
      if(c===13||c===0||(c>=24&&c<=31)){ i++; continue; }
      if(c===9) s+="\t";
      i+=8; continue;
    }
    s+=String.fromCharCode(c); i++;
  }
  return s;
}
function rowLines(rows){
  const lines=[];
  for(const cells of rows){
    const filled=cells.filter(Boolean);
    if(!filled.length){ lines.push(""); continue; }
    if(cells.length>=2&&cells[0]&&cells[0].length<=12&&!/\n/.test(cells[0])&&cells.slice(1).some(Boolean)) lines.push(cells[0]+"\t"+cells.slice(1).filter(Boolean).join(" ").replace(/\n/g," "));
    else if(cells.length>=2&&!cells[0]&&cells.slice(1).some(Boolean)) lines.push("\t"+cells.slice(1).filter(Boolean).join(" ").replace(/\n/g," "));
    else lines.push(...filled);
  }
  lines.push("");
  return lines;
}
function hwpSection(d,out){
  const dv=new DataView(d.buffer,d.byteOffset,d.byteLength);
  const stack=[], body=[];
  const target=()=>{ const t=stack[stack.length-1]; if(!t) return body; if(t.kind==="tbl") return t.cell? t.cell.paras : (t.junk=t.junk||[]); return t.paras; };
  const close=t=>{
    let lines=[];
    if(t.kind==="tbl"){
      const rows=Object.keys(t.rows).map(Number).sort((a,b)=>a-b).map(r=>t.rows[r].sort((a,b)=>a.col-b.col).map(c=>c.paras.map(p=>p.text).join("\n").trim()));
      lines=rowLines(rows);
    } else if(t.kind==="gso") lines=t.paras.map(p=>p.text);
    const dest=target(); lines.forEach(text=>dest.push({text}));

    while(stack.length&&lv<=stack[stack.length-1].level){ const t=stack.pop(); close(t); }
    if(tag===71&&sz>=4){

      else if(id==="gso ") stack.push({level:lv,kind:"gso",paras:[]});
      else if(["head","foot","fn  ","en  ","atno","pgnp","tcmt"].includes(id)) stack.push({level:lv,kind:"skip",paras:[]});
    } else if(tag===72){

async function hwpxToText(bytes){
  const zip=await JSZip.loadAsync(bytes);

  const walkPara=(p,dest)=>{
    // body text of this paragraph (outside any table), then its tables row by row
    let txt=""; for(const t of p.getElementsByTagNameNS("*","t")) if(!up(t,"tbl")) txt+=runText(t);
    const tbls=[...p.getElementsByTagNameNS("*","tbl")].filter(t=>!up(t,"tbl"));
    if(txt.trim()||!tbls.length) dest.push(txt);
    for(const tb of tbls){
      const rows=[...tb.children].filter(c=>c.localName==="tr").map(tr=>[...tr.children].filter(c=>c.localName==="tc").map(tc=>
        [...tc.getElementsByTagNameNS("*","p")].filter(n=>up(n,"tc")===tc).map(n=>{ let s=""; for(const t of n.getElementsByTagNameNS("*","t")) if(up(t,"tc")===tc) s+=runText(t); return s; }).join("\n").trim()));

  return out.join("\n").replace(/\n{3,}/g,"\n\n");
}

function keyMask(text, keys){
  const m=new Array(text.length).fill(false);
  (keys||[]).forEach(k=>{ if(!k) return; let p=text.indexOf(k); while(p>=0){ for(let j=p;j<p+k.length;j++) m[j]=true; p=text.indexOf(k,p+k.length);} });
  return m;
}
const isLetter=ch=>/[0-9A-Za-zㄱ-ㆎ가-힣]/.test(ch);
function speechHTML(text, o={}){
  let html="";
  for(const part of text.split(/([(（][^)）]*[)）])/)){
    if(!part) continue;
    if(/^[(（]/.test(part)){ html+=`<span class="inline-dir">${esc(part)}</span>`; continue; }
    const km=keyMask(part,o.keys); let open=false;
    for(let i=0;i<part.length;i++){
      const ch=part[i], wordStart=i===0||/\s/.test(part[i-1]);
      const hidden=o.mask && isLetter(ch) && !(o.mask==="first"&&wordStart) && !(o.mask==="keys"&&km[i]);
      const marked=!hidden && km[i] && (o.showKeys||o.mask==="keys");
      if(marked&&!open){ html+='<mark class="key">'; open=true; }
      if(!marked&&open){ html+="</mark>"; open=false; }
      html+= hidden? '<span class="h"></span>' : esc(ch);
    }
    if(open) html+="</mark>";
  }
  return html;
}

/* =========================================================

const idb={
  db:null,
  open(){ if(this.db) return Promise.resolve(this.db); return new Promise(res=>{ try{ const r=indexedDB.open("daebon",1);
    r.onupgradeneeded=()=>{ const d=r.result; if(!d.objectStoreNames.contains("scripts")) d.createObjectStore("scripts",{keyPath:"id"}); };
    r.onsuccess=()=>{ this.db=r.result; res(this.db); }; r.onerror=()=>res(null); }catch(e){ res(null); } }); },
  async run(mode,fn){ const d=await this.open(); if(!d) throw new Error("noidb"); return new Promise((res,rej)=>{ const t=d.transaction("scripts",mode); const rq=fn(t.objectStore("scripts")); t.oncomplete=()=>res(rq&&rq.result); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error); }); },
  all(){ return this.run("readonly",st=>st.getAll()); },
  put(s){ return this.run("readwrite",st=>st.put(s)); },
  del(id){ return this.run("readwrite",st=>st.delete(id)); }
};
function mergeProg(a,b){
  const resetAt=Math.max(a.progResetAt||0,b.progResetAt||0), prog={};
  for(const src of [a.prog||{},b.prog||{}]) for(const [k,v] of Object.entries(src)){
    if(!v||(v.at||0)<resetAt) continue;
    if(!prog[k]||(v.at||0)>(prog[k].at||0)) prog[k]=v;
  }
  return {prog,resetAt};
}
const saveTimers=new Map();
const plain=s=>{ const {example,...rest}=s; return JSON.parse(JSON.stringify(rest)); };
function saveScript(s, delay=400){

  saveTimers.set(s.id,setTimeout(async()=>{
    saveTimers.delete(s.id);

    catch(e){ toast(e&&e.name==="QuotaExceededError"? "기기 저장 공간이 부족해요. 안 쓰는 대본을 지워 주세요." : "이 기기에 저장하지 못했어요."); }
  },delay));
}

/* backup file: everything except recordings unless asked */
async function exportBackup(withRecs){

  if(withRecs){ for(const k of recs.keys){ const b=await recs.getKey(k); if(b) data.recordings[k]={type:b.type||"audio/webm",data:await blobToB64(b)}; } }
  const name=`대본연습실-백업-${new Date().toISOString().slice(0,10)}.json`;
  const file=new File([JSON.stringify(data)],name,{type:"application/json"});

const blobToB64=b=>new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(",")[1]||""); r.onerror=()=>res(""); r.readAsDataURL(b); });
function b64ToBlob(d,type){ const bin=atob(d); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return new Blob([u],{type}); }
async function importBackup(file){
  let data; try{ data=JSON.parse(await file.text()); }catch(e){ toast("백업 파일을 읽지 못했어요."); return; }
  if(!data||data.app!=="daebon"||!Array.isArray(data.scripts)){ toast("대본 연습실 백업 파일이 아니에요."); return; }
  let added=0, updated=0;
  for(const inc of data.scripts){
    if(!inc||!inc.id||!Array.isArray(inc.lines)) continue;
    const local=S.scripts.find(x=>x.id===inc.id);
    if(!local){ S.scripts.push(inc); await idb.put(inc).catch(()=>{}); added++; continue; }
    // newer copy wins for the script; progress is merged line by line either way
    const merged=mergeProg(local,inc);

  }
  let nrec=0; for(const [k,v] of Object.entries(data.recordings||{})){ try{ const [sid,i]=k.split(":"); await recs.put(sid,Number(i),b64ToBlob(v.data,v.type)); nrec++; }catch(e){} }
  render(); toast(`백업을 불러왔어요. 새 대본 ${added}개, 합친 대본 ${updated}개${nrec?`, 녹음 ${nrec}개`:""}.`);
}

const AI_KEY="daebon-ai";

function parseJSONLoose(text){
  let t=String(text||"").trim();
  const fence=t.match(/```(?:json)?\s*([\s\S]*?)```/i); if(fence) t=fence[1].trim();
  try{ return JSON.parse(t); }catch(e){}
  const a=Math.min(...["{","["].map(c=>{ const i=t.indexOf(c); return i<0?Infinity:i; }));
  const b=Math.max(t.lastIndexOf("}"),t.lastIndexOf("]"));
  if(a<Infinity&&b>a){ try{ return JSON.parse(t.slice(a,b+1)); }catch(e){} }
  throw {code:"invalid_json",message:"JSON을 찾지 못했어요",text};
}
async function httpErr(r,who){
  let msg=""; try{ const j=await r.json(); msg=(j.error&&(j.error.message||j.error.status))||""; }catch(e){}
  if(r.status===401||r.status===403||/API[ _]?key/i.test(msg)) return {code:"bad_key",message:`${who} API 키가 맞지 않거나 권한이 없어요. ${msg}`};
  if(r.status===429) return {code:"rate_limited",message:`${who} 사용 한도에 걸렸어요. ${msg}`};
  if(r.status===404||/model/i.test(msg)&&r.status===400) return {code:"bad_model",message:`${who} 모델 이름을 찾지 못했어요. 설정에서 '연결 확인'을 눌러 주세요. ${msg}`};
  return {code:"upstream_error",message:`${who} 오류 (${r.status}) ${msg}`};
}
const fastOK={gemini:true,openai:true};
function fastGemini(model){ if(/gemini-2\.5-flash/.test(model)) return {thinkingConfig:{thinkingBudget:0}}; if(/gemini-[3-9]/.test(model)) return {thinkingConfig:{thinkingLevel:"low"}}; return {}; }
function makeGemini(key,model){
  const call=async(prompt,o={},json)=>{
    const parts=[{text:prompt}];
    for(const img of [].concat(o.images||[])) parts.push({inline_data:{mime_type:img.type||"image/jpeg",data:await blobToB64(img)}});
    let r;
    try{ r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,{method:"POST",signal:o.signal,
      headers:{"Content-Type":"application/json","x-goog-api-key":key},
      body:JSON.stringify({contents:[{role:"user",parts}],generationConfig:{...(json?{responseMimeType:"application/json"}:{}),...(fastOK.gemini?fastGemini(model):{})}})}); }
    catch(e){ throw e&&e.name==="AbortError"? {code:"cancelled"} : {code:"upstream_error",message:"인터넷 연결을 확인해 주세요."}; }
    if(!r.ok){ const e=await httpErr(r,"제미나이"); if(fastOK.gemini&&Object.keys(fastGemini(model)).length&&/think/i.test(e.message||"")){ fastOK.gemini=false; return call(prompt,o,json); } throw e; }
    const j=await r.json(); const c=j.candidates&&j.candidates[0];
    if(!c){ throw {code:"refused",message:"제미나이가 이 내용에 답하지 않았어요."}; }
    const text=((c.content&&c.content.parts)||[]).map(p=>p.text||"").join("");
    if(!text.trim()) throw {code:c.finishReason==="SAFETY"?"refused":"empty_completion",message:"제미나이가 빈 답을 보냈어요."};

function makeOpenAI(key,model){

      headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},
      body:JSON.stringify({model,messages:[{role:"user",content}],...(json?{response_format:{type:"json_object"}}:{}),...(fastOK.openai&&/^(gpt-5|o\d)/.test(model)?{reasoning_effort:"low"}:{})})}); }
    catch(e){ throw e&&e.name==="AbortError"? {code:"cancelled"} : {code:"upstream_error",message:"인터넷 연결을 확인해 주세요."}; }
    if(!r.ok){ const e=await httpErr(r,"ChatGPT"); if(fastOK.openai&&/^(gpt-5|od)/.test(model)&&/reasoning/i.test(e.message||"")){ fastOK.openai=false; return call(prompt,o,json); } throw e; }
    const j=await r.json(); const c=j.choices&&j.choices[0];
    const text=c&&c.message&&c.message.content||"";
    if(c&&c.message&&c.message.refusal) throw {code:"refused",message:"ChatGPT가 이 내용에 답하지 않았어요."};
    if(!text.trim()) throw {code:"empty_completion",message:"ChatGPT가 빈 답을 보냈어요."};
    return {text,truncated:c.finish_reason==="length"};

/* '연결 확인': checks the key and picks a current model from the provider's own list */
async function checkAI(mode,key){
  if(!key) throw {message:"API 키를 넣어 주세요."};
  if(mode==="gemini"){
    const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models?pageSize=200",{headers:{"x-goog-api-key":key}});
    if(!r.ok) throw await httpErr(r,"제미나이");
    const ms=((await r.json()).models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes("generateContent")).map(m=>m.name.replace(/^models\//,""));
    const ver=n=>{ const v=n.match(/gemini-(\d+(?:\.\d+)?)/); return v?Number(v[1]):0; };
    const ok=ms.filter(n=>/^gemini-[\d.]+-flash$/.test(n)||/^gemini-[\d.]+-flash-latest$/.test(n)||/^gemini-flash-latest$/.test(n));
    const pick=(ok.length?ok:ms.filter(n=>/flash/.test(n)&&!/lite|image|tts|audio|live|exp|preview/.test(n))).sort((a,b)=>ver(b)-ver(a))[0]||ms[0];
    return {model:pick,models:ms};
  } else {
    const r=await fetch("https://api.openai.com/v1/models",{headers:{"Authorization":"Bearer "+key}});
    if(!r.ok) throw await httpErr(r,"ChatGPT");
    const ms=((await r.json()).data||[]).map(m=>m.id);
    const ver=n=>{ const v=n.match(/gpt-(\d+(?:\.\d+)?)/); return v?Number(v[1]):0; };
    const mini=ms.filter(n=>/^gpt-[\d.]+-mini$/.test(n)).sort((a,b)=>ver(b)-ver(a));
    const pick=mini[0]||ms.filter(n=>/^gpt-4o-mini$/.test(n))[0]||ms.filter(n=>/^gpt-/.test(n))[0];
    return {model:pick,models:ms};
  }
}

/* =========================================================
   Recordings (this device only, IndexedDB)
   ========================================================= */
const recs={
  db:null, keys:new Set(),
  async open(){ if(this.db) return this.db; return new Promise(res=>{ try{ const r=indexedDB.open("sp-recs",1); r.onupgradeneeded=()=>r.result.createObjectStore("recs"); r.onsuccess=()=>{this.db=r.result;res(this.db);}; r.onerror=()=>res(null);}catch(e){res(null);} }); },
  async tx(mode,fn){ const d=await this.open(); if(!d) return null; return new Promise(res=>{ try{ const t=d.transaction("recs",mode); const rq=fn(t.objectStore("recs")); t.oncomplete=()=>res(rq&&rq.result); t.onerror=()=>res(null);}catch(e){res(null);} }); },
  async load(){ const k=await this.tx("readonly",st=>st.getAllKeys()); this.keys=new Set(k||[]); },
  has(sid,i){ return this.keys.has(sid+":"+i); },
  get(sid,i){ return this.tx("readonly",st=>st.get(sid+":"+i)); },
  getKey(k){ return this.tx("readonly",st=>st.get(k)); },
  async put(sid,i,blob){ await this.tx("readwrite",st=>st.put(blob,sid+":"+i)); this.keys.add(sid+":"+i); },
  async del(sid,i){ await this.tx("readwrite",st=>st.delete(sid+":"+i)); this.keys.delete(sid+":"+i); },
  async clearScript(sid){ for(const k of [...this.keys]) if(k.startsWith(sid+":")){ await this.tx("readwrite",st=>st.delete(k)); this.keys.delete(k);} }
};

let speakTok=0, curAudio=null;
const VOICES=["airy","rounded","glassy","buttery"];
function voiceIdx(s, role){ const rs=rolesOf(s.lines).map(x=>x.r).filter(r=>r!==s.myRole); return Math.max(0,rs.indexOf(role)); }
function stopSpeech(){ speakTok++; try{ tts&&tts.stop(); }catch(e){} try{ window.speechSynthesis&&speechSynthesis.cancel(); }catch(e){} if(curAudio){ curAudio.pause(); curAudio=null; } }
async function playBlob(blob,tok){ const url=URL.createObjectURL(blob); curAudio=new Audio(url); curAudio.playbackRate=S.settings.rate; await new Promise(res=>{ curAudio.onended=curAudio.onerror=res; curAudio.play().catch(res); }); URL.revokeObjectURL(url); return tok===speakTok; }
async function speakLine(s, i){
  stopSpeech(); const tok=speakTok; const l=s.lines[i];
  if(!s.example && recs.has(s.id,i)){ const blob=await recs.get(s.id,i); if(blob&&tok===speakTok) return playBlob(blob,tok); }
  const text=speechOnly(l.t); if(!text) return tok===speakTok;
  const vi=voiceIdx(s,l.r);
  if(tts){
    try{ await tts.speak(text.slice(0,1900),{voice:VOICES[vi%VOICES.length], rate:S.settings.rate, language:"ko"}); return tok===speakTok; }
    catch(e){ if(tok!==speakTok) return false; if(["not_granted","unavailable","capability_disabled","not_declared"].includes(e&&e.code)) tts=null; else if(e&&e.code!=="busy"&&e.code!=="rate_limited") return false; }
  }
  if("speechSynthesis" in window){
    await new Promise(res=>{ try{ const u=new SpeechSynthesisUtterance(text); u.lang="ko-KR"; u.rate=S.settings.rate; u.pitch=[1,0.8,1.2,0.95][vi%4];
      const v=speechSynthesis.getVoices().find(v=>/^ko/i.test(v.lang)); if(v) u.voice=v; u.onend=u.onerror=res; speechSynthesis.speak(u);
      setTimeout(res, 1500+text.length*260/S.settings.rate); }catch(e){res();} });
    return tok===speakTok;
  }
  return false;
}

function myIdx(s, sec){ const a=sec?sec.start:0, b=sec?sec.end:s.lines.length; const out=[]; for(let i=a;i<b;i++){ const l=s.lines[i]; if(l.k==="line"&&l.r===s.myRole) out.push(i);} return out; }
function status(s,i){ const p=(s.prog||{})[i]; if(!p) return "new"; if(p.last==="ok"&&p.ok>=2) return "ok"; if(p.last==="ng") return "ng"; return "mid"; }
function mastery(s,sec){ const m=myIdx(s,sec); if(!m.length) return 0; return Math.round(m.filter(i=>status(s,i)==="ok").length/m.length*100); }
function mark(s,i,ok){ s.prog=s.prog||{}; const p=s.prog[i]||{ok:0,ng:0}; if(ok) p.ok++; else p.ng++; p.last=ok?"ok":"ng"; p.at=Date.now(); s.prog[i]=p; s.lastRun=Date.now(); if(!s.example) saveScript(s,1500); }

function aiErrMsg(e){
  const c=e&&e.code;
  if(c==="bad_key"||c==="bad_model") return e.message;
  if(c==="invalid_json") return "AI 답에서 결과(JSON)를 찾지 못했어요. 다시 시도해 주세요.";
  if(c==="rate_limited"&&e.message) return e.message;
  if(c==="cancelled") return "멈췄어요.";
  if(c==="not_granted"||c==="sampling_disabled"){ sample=null; return "AI 사용이 허용되지 않았어요."; }
  if(c==="rate_limited") return "AI 사용량이 많아요. 잠시 후 다시 해 주세요.";
  if(c==="prompt_too_large") return "한 번에 보내기엔 너무 길어요.";
  if(c==="refused") return "AI가 이 부분을 분석하지 않았어요.";
  return "AI 분석 중 문제가 생겼어요. 다시 시도해 주세요.";
}
const lineStr=(s,i)=>{ const l=s.lines[i]; return `[${i}] `+(l.k==="line"?`${l.r}: ${l.t}`:l.t); };
function rangeText(s,a,b,max){ let out="", n=0; for(let i=a;i<b;i++){ const t=lineStr(s,i)+"\n"; if(n+t.length>max) break; out+=t; n+=t.length; } return out; }
function workChunks(s, max=16000){
  const secs=sectionsOf(s), chunks=[]; let cur=null;
  const size=(a,b)=>{ let n=0; for(let i=a;i<b;i++) n+=s.lines[i].t.length+12; return n; };
  for(const x of secs){
    const n=size(x.start,x.end);
    if(n>max){
      if(cur){ chunks.push(cur); cur=null; }
      let a=x.start, acc=0;
      for(let i=x.start;i<x.end;i++){ acc+=s.lines[i].t.length+12; if(acc>max){ chunks.push({from:a,to:i,starts:a===x.start?[x.start]:[]}); a=i; acc=0; } }
      chunks.push({from:a,to:x.end,starts:a===x.start?[x.start]:[]});
      continue;
    }
    if(cur && size(cur.from,x.end)>max){ chunks.push(cur); cur=null; }
    if(!cur) cur={from:x.start,to:x.end,starts:[x.start]}; else { cur.to=x.end; cur.starts.push(x.start); }
  }
  if(cur) chunks.push(cur);
  return chunks;
}
function startJob(s,label,total){ const j={sid:s.id,label,done:0,total,ctl:new AbortController()}; S.job=j; render(); return j; }
function endJob(){ S.job=null; render(); }

/* One question, one answer: the work + my role. Nothing runs automatically. */
function wholeText(s,limit){
  const full=rangeText(s,0,s.lines.length,Infinity);
  if(full.length<=limit) return full;
  // long play: keep every line but shorten long speeches so the whole story still fits
  let cut=120, t=full;
  while(cut>=30){ t=s.lines.map((l,i)=>{ const x=l.k==="line"?`${l.r}: ${l.t}`:l.t; return `[${i}] `+(x.length>cut?x.slice(0,cut)+"…":x); }).join("\n"); if(t.length<=limit) return t; cut-=20; }
  return t.slice(0,limit);
}

async function analyzeNotes(s, job, onlySec){
  const secs=onlySec?[onlySec]:sectionsOf(s);
  if(!s.notes||s.notes.role!==s.myRole) s.notes={role:s.myRole,map:{}};
  const batches=[];

    // one question covers up to 80 of my lines across scenes (fewer copy-pastes)
    const all=secs.flatMap(x=>myIdx(s,x).filter(i=>!s.notes.map[i]));
    for(let k=0;k<all.length;k+=80){ const ids=all.slice(k,k+80); batches.push({sec:secOfLine(s,ids[0]),last:secOfLine(s,ids[ids.length-1]),ids}); }
  } else for(const x of secs){ const m=myIdx(s,x).filter(i=>!s.notes.map[i]); for(let k=0;k<m.length;k+=25) batches.push({sec:x,ids:m.slice(k,k+25)}); }
  job.label="내 대사 핵심 단어·흐름 설명 만드는 중"; job.done=0; job.total=batches.length; render();
  const A=s.analysis||{};
  for(const b of batches){
    const a=Math.max(b.sec.start,b.ids[0]-12), z=Math.min((b.last||b.sec).end,b.ids[b.ids.length-1]+4);
    const ev=A.scenes&&A.scenes[b.sec.start]?`이 장면(${b.sec.label})의 사건: ${A.scenes[b.sec.start].event}\n`:"";
    const prompt=`너는 배우의 대사 암기를 돕는 연기 코치다. 연극 "${s.title}"에서 배우가 맡은 배역은 "${s.myRole}"이다.

async function runPipeline(s, steps){

/* device speech recognition (Chrome, Edge, Safari on iPhone) with the same shape the rehearsal code uses */
function makeDictation(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR) return null;
  let rec=null, state="idle", hp=[], hf=[], hs=[], endRes=null;
  const emit=(arr,v)=>arr.forEach(f=>{ try{ f(v); }catch(e){} });
  const setState=(st,reason)=>{ state=st; emit(hs, reason?{state:st,reason}:{state:st}); };
  return {
    start(){ return new Promise((res,rej)=>{
      if(rec){ res(); return; }
      rec=new SR(); rec.lang="ko-KR"; rec.interimResults=true; rec.continuous=true;
      let started=false, err=null;
      rec.onstart=()=>{ started=true; setState("listening"); res(); };
      rec.onresult=ev=>{ let interim=""; for(let i=ev.resultIndex;i<ev.results.length;i++){ const r=ev.results[i]; if(r.isFinal) emit(hf,{text:" "+r[0].transcript.trim()}); else interim+=r[0].transcript; } emit(hp,{text:interim}); };
      rec.onerror=ev=>{ err=ev.error; if(!started) rej({code:(ev.error==="not-allowed"||ev.error==="service-not-allowed")?"not_granted":"unavailable"}); };
      rec.onend=()=>{ rec=null; const reason=(err==="not-allowed"||err==="service-not-allowed")?"not_granted":(err&&err!=="no-speech"&&err!=="aborted")?"upstream_error":"stopped"; setState("idle",reason); if(endRes){ endRes(); endRes=null; } };
      setState("starting");
      try{ rec.start(); }catch(e){ rec=null; setState("idle","unavailable"); rej({code:"unavailable"}); }
    }); },
    stop(){ return new Promise(res=>{ if(!rec){ res(); return; } endRes=res; setState("finishing"); try{ rec.stop(); }catch(e){ res(); } setTimeout(res,2500); }); },
    active(){ return state!=="idle"; },
    onPartial(f){ hp.push(f); return ()=>{ hp=hp.filter(x=>x!==f); }; },
    onFinal(f){ hf.push(f); return ()=>{ hf=hf.filter(x=>x!==f); }; },
    onState(f){ hs.push(f); return ()=>{ hs=hs.filter(x=>x!==f); }; }
  };
}

function lcs(a,b){ const n=a.length,m=b.length; if(!n||!m) return 0; let prev=new Array(m+1).fill(0); for(let i=1;i<=n;i++){ const c=[0]; for(let j=1;j<=m;j++) c[j]=a[i-1]===b[j-1]?prev[j-1]+1:Math.max(prev[j],c[j-1]); prev=c; } return prev[m]; }

function relMap(s){
  const A=s.analysis; const rel=A.rel||[]; if(!rel.length) return `<p class="muted small">관계 정보가 없어요.</p>`;

  const names=[...new Set([...(A.chars||[]).map(c=>c.name),...rel.flatMap(r=>[r.a,r.b])])].sort((a,b)=>(counts[b]||0)-(counts[a]||0)).slice(0,14);

    // up to four people: everyone on one ring (me at the bottom), so no line runs behind a node in the middle
    const ring=[center,...others], m=ring.length;

  rel.forEach((r,k)=>{ const p=pos[r.a], q=pos[r.b]; if(!p||!q) return;
    edges+=`<line class="edge${S.relSel===k?" sel":""}" data-act="relsel" data-k="${k}" x1="${p.x}" y1="${p.y}" x2="${q.x}" y2="${q.y}"><title>${esc(r.label)}</title></line>`;
    const mx=(p.x+q.x)/2, my=(p.y+q.y)/2, w=Math.max(24,[...r.label].length*11+8);

  const nodes=names.map(n=>{ const p=pos[n], me=n===s.myRole, r=n===center?34:26; const lbl=[...n].length>5?[...n].slice(0,5).join("")+"…":n;

  return `<div style="overflow-x:auto"><svg class="map" viewBox="${x0} ${y0} ${W} ${H}" style="max-width:${Math.round(W*1.5)}px" role="img" aria-label="인물 관계도">${edges}${labels}${nodes}</svg></div>`;

function curveSVG(s,arc){

    case "aliasfind": findAliasesFor(s); break;
    case "aliasapply": applyAliasEdit(s); break;
    case "aliascancel": if(S.aliasEdit&&S.aliasEdit.busy) S.aliasEdit.busy.abort(); S.aliasEdit=null; render(); break;
    case "undoalias": undoAlias(s,b.dataset.a); toast(`'${b.dataset.a}'를 따로 된 인물로 되돌렸어요.`); break;
    case "manualalias": {
      const p=b.dataset.p, from=document.getElementById(p+"From").value, to=document.getElementById(p+"To").value;
      if(from===to){ toast("서로 다른 이름을 골라 주세요."); break; }
      if(p==="add"){ const A=S.add; A.groups=addManualGroup(A.groups||[],from,to,A.raw); applyAddAliases(); }
      else if(S.aliasEdit){ S.aliasEdit.groups=addManualGroup(S.aliasEdit.groups,from,to,s.lines); }
      rerender(); break; }
    case "editsave": { const t=document.getElementById("editTitle").value.trim(), r=document.getElementById("editRole").value; if(t) s.title=t; if(r!==s.myRole){ s.myRole=r; s.prog={}; s.progResetAt=Date.now(); } saveScript(s,0); S.edit=false; render(); break; }
    case "askdel": S.confirmDel=!S.confirmDel; render(); break;
    case "del": await deleteScript(s); S.view="library"; S.edit=false; S.confirmDel=false; render(); toast("대본을 지웠어요."); break;
    case "askreset": S.confirmReset=!S.confirmReset; rerender(); break;
    case "reset": s.prog={}; s.progResetAt=Date.now(); saveScript(s,0); S.confirmReset=false; render(); toast("진도를 초기화했어요."); break;
    case "auto": S.settings.auto=!S.settings.auto; saveSettings(); rerender(); break;
    case "typing": startTyping(); break;
    case "typedone": finishTyping(); break;
    case "typecancel": S.run.typing=false; S.run.typed=""; rerender(); break;
    case "runall": startRun(s,false); break;
    case "onlymine": { S.settings.onlyMine=b.dataset.v==="1"; saveSettings(); const sec=runSection(s); if(S.settings.onlyMine&&sec&&!myIdx(s,sec).length) S.runSec="all"; rerender(); break; }
    case "runweak": startRun(s,true); break;
    case "runweakall": S.runSec="all"; startRun(s,true); break;
    case "runexit": stopSpeech(); stopDict(); S.run=null; try{S.wake&&S.wake.release();}catch(_){} render(); break;
    case "next": next(); break;
    case "prev": prev(); break;
    case "hint": S.run.hint=b.dataset.h; S.settings.hint=b.dataset.h; saveSettings(); rerender(); break;
    case "rstory": S.run.showStory=!S.run.showStory; rerender(); break;
    case "reveal1": S.run.revealed=true; rerender(); break;
    case "dict": startDict(); break;
    case "dictdone": finishDict(); break;
    case "judge": { const ok=b.dataset.ok==="1"; const idx=S.run.seq[S.run.pos]; if(ok) S.run.okN++; else S.run.ngN++; mark(s,idx,ok); next(); break; }
  }
});

render();
recs.load().then(()=>render());
initApp();
if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
